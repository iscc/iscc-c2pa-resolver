[project]
name = "iscc-c2pa-resolver"
version = "0.1.0"
description = "C2PA Soft Binding Resolution API for ISCC (io.iscc.v0) on top of the ISCC Discovery Protocol"
authors = [{ name = "Titusz Pan", email = "tp@py7.de" }]
readme = "README.md"
license = "Apache-2.0"
requires-python = ">=3.12"
classifiers = [
    "License :: OSI Approved :: Apache Software License",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3.12",
    "Programming Language :: Python :: 3.13",
    "Programming Language :: Python :: 3.14",
    "Framework :: FastAPI",
    "Private :: Do Not Upload",
]
dependencies = [
    "cachetools>=6.2",
    "fastapi>=0.140",
    "httpx2>=2.13.1,<3",
    "iscc-core>=1.4.0",
    "pydantic-settings>=2.10",
    "uvicorn[standard]>=0.50",
]

[project.urls]
Homepage = "https://iscc.io"
Repository = "https://github.com/iscc/iscc-c2pa-resolver"

[dependency-groups]
dev = [
    "brotli>=1.2.0",
    "datamodel-code-generator>=0.83",
    "hypothesis>=6.160",
    "mdformat>=1.0.0",
    "mdformat-mkdocs[recommended]>=5.1",
    "openapi-spec-validator>=0.9",
    "poethepoet>=0.48",
    "prek>=0.5",
    "pyright>=1.1.400",
    "pytest>=9.0",
    "pytest-asyncio>=1.2",
    "pytest-cov>=7.0",
    "pyyaml>=6.0.3",
    "ruff>=0.16",
    "schemathesis>=4.29",
    "types-cachetools>=6.2",
]
docs = [
    "zensical-iscc",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["iscc_c2pa_resolver"]

[tool.ruff]
line-length = 120
target-version = "py312"

[tool.ruff.lint]
select = [
    "E",   # pycodestyle errors
    "W",   # pycodestyle warnings
    "F",   # pyflakes
    "I",   # isort
    "B",   # flake8-bugbear
    "C4",  # flake8-comprehensions
    "C90", # mccabe complexity
    "UP",  # pyupgrade
    "S",   # flake8-bandit (security)
    "SIM", # flake8-simplify
    "RUF", # ruff-specific
]

[tool.ruff.lint.mccabe]
max-complexity = 8

[tool.ruff.lint.per-file-ignores]
"tests/**" = ["S101"] # assert is how pytest works
"iscc_c2pa_resolver/schema/**" = ["E501"] # generated from the OpenAPI descriptions

[tool.ruff.format]
line-ending = "lf"

[tool.pyright]
pythonVersion = "3.12"
typeCheckingMode = "standard"
include = ["iscc_c2pa_resolver"]
exclude = ["iscc_c2pa_resolver/schema"]  # generated by datamodel-codegen

[tool.pytest.ini_options]
testpaths = ["tests"]
asyncio_mode = "auto"
asyncio_default_fixture_loop_scope = "function"
addopts = "-q --strict-markers"
filterwarnings = [
    "error",
    # Schemathesis' ASGI client (schemathesis/python/asgi.py) never closes its anyio memory streams
    "ignore:Unclosed <MemoryObject(Receive|Send)Stream:ResourceWarning",
]

[tool.coverage.run]
branch = true
source = ["iscc_c2pa_resolver"]

[tool.coverage.report]
fail_under = 100
show_missing = true
skip_covered = true
skip_empty = true

[tool.datamodel-codegen]
input = "iscc_c2pa_resolver/openapi/openapi.yaml"
input-file-type = "openapi"
output = "iscc_c2pa_resolver/schema"
output-model-type = "pydantic_v2.BaseModel"
disable-timestamp = true
target-python-version = "3.12"
use-standard-collections = true
use-union-operator = true
use-annotated = true
field-constraints = true
collapse-root-models = true
use-subclass-enum = true
formatters = ["ruff-format"]

[tool.poe.tasks]
sync-c2pa = { cmd = "python scripts/sync_c2pa_openapi.py", help = "Copy the implemented subset of the C2PA OpenAPI from a specs-core checkout" }
vendor-c2pa-web = { cmd = "python scripts/vendor_c2pa_web.py", help = "Download and precompress the in-browser C2PA reader and the C2PA trust list" }
codegen = { sequence = [{ cmd = "python scripts/openapi_json.py" }, { cmd = "datamodel-codegen" }, { cmd = "ruff check --fix --quiet iscc_c2pa_resolver/schema" }, { cmd = "ruff format --quiet iscc_c2pa_resolver/schema" }], help = "Generate openapi.json and pydantic models from openapi.yaml" }
format = { sequence = [{ cmd = "ruff format ." }, { cmd = "ruff check --fix ." }, { cmd = "mdformat README.md CLAUDE.md SECURITY.md docs" }], help = "Format and autofix code and docs" }
lint = { sequence = [{ cmd = "ruff format --check ." }, { cmd = "ruff check ." }, { cmd = "mdformat --check README.md CLAUDE.md SECURITY.md docs" }], help = "Check formatting and lint rules" }
typecheck = { cmd = "pyright", help = "Static type check" }
test = { cmd = "pytest --cov --cov-report=term-missing --cov-report=xml", help = "Run tests with 100% branch coverage gate" }
test-js = { cmd = "node --test --experimental-test-coverage --test-coverage-include=iscc_c2pa_resolver/static/credentials.js --test-coverage-lines=100 --test-coverage-branches=100 --test-coverage-functions=100 tests/js/*.test.mjs", help = "Run the landing page JavaScript tests with a 100% coverage gate (needs Node 22.8+)" }
audit = { cmd = "uv audit --frozen", help = "Check locked dependencies for known vulnerabilities" }
serve = { cmd = "uvicorn iscc_c2pa_resolver.app:app --host 127.0.0.1 --port 45460 --reload", help = "Run a local dev server on port 45460" }
conformance = { cmd = "bash scripts/conformance.sh ${base_url}", args = [{ name = "base_url", default = "http://127.0.0.1:45460/v1" }], help = "Run the C2PA conformance harness against a running server" }
docs-serve = { cmd = "zensical serve --dev-addr 127.0.0.1:45461", help = "Preview the documentation site on port 45461" }
docs-build = { cmd = "zensical-iscc build", help = "Build the documentation site into site/" }
docs-check = { cmd = "zensical-iscc check --strict", help = "Check the built documentation site against the ISCC theme rules" }
all = { sequence = ["format", "typecheck", "test", "test-js"], help = "Format, type check and test (local dev loop)" }
ci = { sequence = ["lint", "typecheck", "test", "test-js", "audit"], help = "All quality gates without modifying files" }

[tool.uv.sources]
zensical-iscc = { git = "https://github.com/iscc/zensical-iscc", tag = "v0.2.0" }

[tool.uv]
default-groups = ["dev", "docs"]
